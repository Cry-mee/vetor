/* ===== Вектор: логістика енергії, проєкти, інкубатор ===== */
const EN={'Жайворонок':'000000233332211122221110','Стандарт':'000000122333321123322110','Сова':'000000011122233321233332'},lvN=['відпочинок','спад','середній','пік'];

const nd=p=>{const a=p.split('.').map(Number);let n=S.proj[a[0]];for(let i=1;i<a.length;i++)n=n.kids[a[i]];return n};

const dl=s=>{if(!s)return'';const n=new Date(),d=new Date(s),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()),x=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(x<b)x.setFullYear(x.getFullYear()+1);return Math.round((x-b)/864e5)};

/* Алгоритм: ставимо найважчі задачі в години, де рівень енергії відповідає ресурсу; потім компроміс */
function route(){const E=S.en,pl=[],un=[];let s=S.start.split(':').map(Number);s=Math.ceil((s[0]*60+s[1])/15)*15;
const lv=(t,m)=>{const a=[];for(let x=t;x<t+m;x+=15)a.push(E[Math.floor(x/60)%24]);return a};
const ok=(k,t,p)=>{const a=lv(t,k.m);if(k.e==1)return p==0?a.every(v=>v==1):p==1?a.every(v=>v>0&&v<3):a.every(v=>v>0);return p==0?a.every(v=>v>=k.e):p==1?a.every(v=>v>0&&v>=k.e-1):a.every(v=>v>0)};
S.tasks.filter(k=>!k.done).sort((a,b)=>b.e-a.e||b.p-a.p).forEach(k=>{for(let p=0;p<3;p++)for(let t=s;t+k.m<=1380;t+=15){if(pl.some(b=>t<b.t+b.k.m+5&&t+k.m+5>b.t))continue;if(ok(k,t,p)){pl.push({t,k,p});return}}un.push(k)});
return{pl:pl.sort((a,b)=>a.t-b.t),un}}

const strip=()=>`<div class="en">${S.en.slice(6).map((l,i)=>`<button data-a="eh" data-h="${i+6}" aria-label="${i+6}:00, ${lvN[l]}" style="height:${12+l*17}px;opacity:${[.15,.4,.7,1][l]}"></button>`).join('')}</div><div class="hr">${S.en.slice(6).map((l,i)=>`<span>${(i+6)%3==0?i+6:''}</span>`).join('')}</div>`;
const tc=(k,i,tm,x)=>`<div class="row"><div class="tm">${tm}<small>${k.m} хв</small></div><div class="c ${k.done?'dn':''}"><div class="r"><button class="ck" data-a="tg" data-i="${i}" aria-label="Готово">${k.done?'✓':''}</button><div class="g tt">${TY[k.ty]} ${esc(k.t)}</div><button data-a="del" data-i="${i}" aria-label="Видалити">×</button></div><div class="r" style="margin:6px 0 0 36px">${x||''}</div><div class="sub">${k.subs.map((s,j)=>`<label><input type="checkbox" data-a="st" data-i="${i}" data-j="${j}" ${s.d?'checked':''}>${esc(s.t)}</label>`).join('')}<div class="r"><input class="g" id="si${i}" placeholder="+ підзавдання"><button data-a="sub" data-i="${i}">Додати</button></div></div></div></div>`;

V.plan=function(){const{pl,un}=route();let o='',pe=null,n=0,tot=0,dm=0;S.tasks.forEach(k=>{tot+=k.m;if(k.done)dm+=k.m});
pl.forEach(({t,k,p})=>{if(pe!==null&&t-pe>=15)o+=`<div class="row brk"><div class="tm" style="background:var(--bd);color:var(--mu)">${f(pe+5)}<small>${t-pe-5} хв</small></div><div class="c"><div class="mu">${lvN[S.en[Math.floor(pe/60)%24]]}: час для фонового навчання</div>${mini(n++)}</div></div>`;

const dn=S.tasks.map((k,i)=>[k,i]).filter(x=>x[0].done);
return`<div class="c" style="background:var(--hl);color:#121a33;border:0">${esc(quote()[0])}</div>
<h2 style="margin-top:0">Крива енергії</h2><div class="c">${strip()}<div class="r" style="margin-top:8px">${Object.keys(EN).map(x=>`<button data-a="pn" data-n="${x}">${x}</button>`).join('')}</div><div class="mu" style="margin-top:6px">Торкнись години, щоб змінити рівень: пік, середній, спад, відпочинок.</div></div>

<div class="r" style="margin:10px 0"><label class="mu">Старт <input type="time" id="stt" value="${S.start}"></label><span class="mu g" style="text-align:right">Фініш ${pe!==null?f(pe):'—'} · зроблено ${dm}/${tot} хв</span></div><div class="bar" style="margin-bottom:14px"><i style="width:${tot?dm/tot*100:0}%"></i></div>
<div class="tl">${o||'<div class="mu">Активних завдань нема — додай нове або візьми пункт із проєкту.</div>'}</div>
${un.length?`<div class="c mu">Не влізло до 23:00: ${un.map(k=>esc(k.t)).join(', ')}. Скороти завдання або зсунь старт.</div>`:''}
${dn.length?`<h2>Готово</h2><div class="tl">${dn.map(([k,i])=>tc(k,i,'✓','')).join('')}</div>`:''}`};

V.proj=function(){return`<div class="c"><div class="r"><input class="g" id="pn" placeholder="Нова мета або проєкт"><button class="p" data-a="pnew">Створити</button></div><div class="r" style="margin-top:8px"><input class="g" id="pin" placeholder="Текст підпункту"></div><div class="mu" style="margin-top:4px">Введи текст і торкнись «+» біля пункту, куди його вкласти. «→» переносить пункт у маршрут дня.</div></div>`+S.proj.map((n,i)=>{const c=cn(n);return`<div class="c"><div class="bar" style="margin-bottom:6px"><i style="width:${c[0]/c[1]*100}%"></i></div>${tree(n,''+i)}</div>`}).join('')};

const BC='Мотивація',BT="======================================================================\n         ДЕВІД ҐОҐҐІНС: НІЧОГО МЕНЕ НЕ ЗЛАМАЄ (CAN'T HURT ME)\n             Стисла вижимка, головні концепції та інструменти\n======================================================================\n\n1. ГОЛОВНА ІДЕЯ КНИГИ\n----------------------------------------------------------------------\nБільшість людей використовують лише близько 40% свого потенціалу. \nНаш мозок має внутрішній «запобіжник» (governor), який вмикається при \nперших ознаках болю, втоми чи дискомфорту, намагаючись захистити нас. \n\nСправжній розвиток починається тоді, коли ви свідомо переступаєте через \nцей бар'єр, виходьте із зони комфорту та будуєте «броньований розум».\n\n----------------------------------------------------------------------\n2. 7 КЛЮЧОВИХ ІНСТРУМЕНТІВ ДЕВІДА ҐОҐҐІНСА\n----------------------------------------------------------------------\n\n1. ДЗЕРКАЛО ВІДПОВІДАЛЬНОСТІ (Accountability Mirror)\n   • Суть: Жорстка і чесна самооцінка без прикрас та виправдань.\n   • Практика: Наклеюйте на дзеркало стікери зі своїми слабкостями, \n     страхами, недоліками та конкретними цілями. Щоранку дивіться собі \n     в очі та вимагайте від себе звіту за кожну дію.\n\n2. ПРАВИЛО 40% (The 40% Rule)\n   • Суть: Коли ви відчуваєте виснаження і ваш розум каже, що ви більше \n     не спроможні зробити жодного кроку — ви використали лише 40% ресурсів.\n   • Практика: У моменти найбільшої втоми усвідомте, що це лише захист \n     мозку. Пробивайте цей бар'єр і робіть ще 5-10% понад заплановане.\n\n3. БАНКА З ПЕЧИВОМ (The Cookie Jar)\n   • Суть: Ментальний резервуар вашої внутрішньої сили.\n   • Практика: Запишіть усі свої минулі перемоги, подолані труднощі, \n     біль та виклики, які ви змогли пережити. У важкі хвилини «діставайте \n     печиво» з пам'яті — згадуйте, хто ви є і через що вже пройшли.\n\n4. ЗАХОПЛЕННЯ ДУШ (Taking Souls)\n   • Суть: Ментальне домінування над труднощами, суперниками чи болем.\n   • Практика: Коли обставини, суперники або критики очікують вашого \n     зламу, працюйте із потрійною силою. Покажіть їм, що їхній тиск \n     робить вас тільки сильнішими.\n\n5. ЗАГАРТУВАННЯ РОЗУМУ (Callousing the Mind)\n   • Суть: Розум загартовується так само, як шкіра на руках — через \n     тертя та постійне навантаження.\n   • Практика: Щодня робіть те, що викликає у вас дискомфорт або \n     лінь (ранковий біг, холодна вода, важке навчання, прибирання). \n     Привчайте розум до дисципліни.\n\n6. ЗАПИТАННЯ «ЩО, ЯКЩО?» (What If?)\n   • Суть: Інструмент для подолання зневіри оточуючих та власних сумнівів.\n   • Практика: Коли люди або ваш власний страх кажуть, що це неможливо, \n     запитайте себе: «А що, якщо я зможу це зробити?». Це перетворює \n     сумніви на паливо.\n\n7. АНАЛІЗ ПОРАЗОК / ПІСЛЯОПЕРАЦІЙНИЙ ОГЛЯД (After Action Report)\n   • Суть: Поразка — це не фінал, а джерело цінних даних для зростання.\n   • Практика: Після невдачі приберіть емоції та саможаль. Проаналізуйте: \n     що пішло не так, як ви відреагували, які помилки допущено та що \n     зробите інакше наступного разу.\n\n----------------------------------------------------------------------\n3. ОСНОВНІ ЖИТТЄВІ УРОКИ\n----------------------------------------------------------------------\n• Ніхто не прийде тебе рятувати: Твоє минуле чи важке дитинство — це \n  не виправдання для слабкості, а стартовий майданчик та паливо.\n• Мотивація — це дурниця, дисципліна — це все: Мотивація швидко минає, \n  коли стає боляче чи холодно. Працює тільки залізна дисципліна.\n• Прийми свої \"погані карти\": Не порівнюй себе з іншими. Грай тими \n  картами, які тобі випали, і витискай з них максимум.\n• Не зупиняйся, коли втомився. Зупиняйся, коли справу зроблено.\n\n======================================================================";

const BTE=`======================================================================
         DAVID GOGGINS: CAN'T HURT ME
          Short summary, key concepts and tools
======================================================================

1. THE MAIN IDEA OF THE BOOK
----------------------------------------------------------------------
Most people use only about 40% of their potential.
Our brain has an inner "governor" that switches on at the first signs
of pain, fatigue or discomfort, trying to protect us.

Real growth begins when you deliberately step over this barrier, leave
your comfort zone and build an "armored mind".

----------------------------------------------------------------------
2. DAVID GOGGINS' 7 KEY TOOLS
----------------------------------------------------------------------

1. THE ACCOUNTABILITY MIRROR
   • Essence: harsh, honest self-assessment with no sugarcoating or excuses.
   • Practice: stick notes on your mirror with your weaknesses, fears,
     flaws and concrete goals. Every morning look yourself in the eye and
     demand an account of every action.

2. THE 40% RULE
   • Essence: when you feel exhausted and your mind says you can't take
     another step, you have used only 40% of your resources.
   • Practice: at moments of greatest fatigue, realize it is only your
     brain's protection. Break through the barrier and do another 5–10%
     beyond what you planned.

3. THE COOKIE JAR
   • Essence: a mental reservoir of your inner strength.
   • Practice: write down all your past victories, hardships overcome,
     pain and challenges you survived. In hard moments, "take a cookie"
     from memory — remember who you are and what you have already been through.

4. TAKING SOULS
   • Essence: mental domination over hardship, rivals or pain.
   • Practice: when circumstances, rivals or critics expect you to break,
     work with triple force. Show them their pressure only makes you stronger.

5. CALLOUSING THE MIND
   • Essence: the mind toughens like the skin of your hands — through
     friction and constant load.
   • Practice: every day do something that causes discomfort or laziness
     (morning run, cold water, hard study, cleaning). Train your mind
     to discipline.

6. THE "WHAT IF?" QUESTION
   • Essence: a tool for overcoming the doubt of others and your own.
   • Practice: when people or your own fear say it's impossible, ask
     yourself: "What if I can do it?" This turns doubt into fuel.

7. AFTER ACTION REPORT
   • Essence: defeat is not the end but a source of valuable data for growth.
   • Practice: after a failure, remove emotion and self-pity. Analyze:
     what went wrong, how you reacted, what mistakes were made and what
     you will do differently next time.

----------------------------------------------------------------------
3. MAIN LIFE LESSONS
----------------------------------------------------------------------
• Nobody is coming to save you: your past or hard childhood is not an
  excuse for weakness, but a launch pad and fuel.
• Motivation is nonsense, discipline is everything: motivation fades fast
  when it gets painful or cold. Only iron discipline works.
• Accept your "bad cards": don't compare yourself with others. Play the
  cards you were dealt and squeeze the maximum out of them.
• Don't stop when you're tired. Stop when the job is done.
