<style>
:root{--bg:#eef1f7;--sf:#fff;--tx:#121a33;--mu:#5d6788;--ac:#2442d6;--at:#fff;--hl:#ffd84a;--ok:#0f8a4f;--bd:#d3d9ea;--gr:rgba(36,66,214,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--sf:#151d33;--tx:#e7ecff;--mu:#8f9bc2;--ac:#8aa8ff;--at:#0c1222;--ok:#4ade80;--bd:#26314f;--gr:rgba(138,168,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1222;--sf:#151d33;--tx:#e7ecff;--mu:#8f9bc2;--ac:#8aa8ff;--at:#0c1222;--ok:#4ade80;--bd:#26314f;--gr:rgba(138,168,255,.07);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--gr) 1px,transparent 1px) 0 0/22px 22px;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:22px 22px;color:var(--tx);font:400 15px/1.45 Onest,system-ui,sans-serif;padding-bottom:88px}
.w{max-width:560px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font:700 20px Unbounded,sans-serif;margin:0}h1 span{background:var(--hl);color:#121a33;padding:0 6px;border-radius:4px}
.dt{color:var(--mu);font-size:13px;text-transform:capitalize}
h2{font:700 15px Unbounded,sans-serif;margin:16px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--at);border-color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.g{flex:1}
.mu{color:var(--mu);font-size:13px}
.tl{position:relative;padding-left:62px}.tl:before{content:"";position:absolute;left:25px;top:6px;bottom:6px;width:3px;background:var(--hl);border-radius:2px}
.row{position:relative;margin-bottom:10px}
.tm{position:absolute;left:-62px;top:10px;width:52px;font:700 12px Unbounded,sans-serif;text-align:center;background:var(--hl);color:#121a33;border-radius:6px;padding:3px 0}
.tm small{display:block;font:400 10px Onest,sans-serif}
.dn .tt{text-decoration:line-through;color:var(--mu)}
.ck{width:28px;height:28px;border-radius:50%;padding:0;flex:none}.dn>.r>.ck{background:var(--ok);color:#fff;border-color:var(--ok)}
.sub{margin:6px 0 0 36px;font-size:14px}.sub label{display:flex;gap:8px;align-items:center;padding:2px 0}
.chip{border:1px solid var(--bd);border-radius:20px;padding:1px 8px;font-size:12px;color:var(--mu);background:var(--bg)}
.brk .c{background:transparent;border-style:dashed;margin:0}
.mc{cursor:pointer}.mc .rv{display:none;color:var(--mu);font-size:14px}.mc.open .rv{display:block}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{background:var(--ac);color:var(--at);border-radius:20px;padding:28px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.big b{font:700 26px Unbounded,sans-serif}.big .bk{display:none;margin-top:12px}.big.open .bk{display:block}
.days{display:flex;gap:6px;margin-bottom:10px}.days button{flex:1;padding:8px 0}.days .on{background:var(--ac);color:var(--at);border-color:var(--ac);font-weight:700}
.q{font:500 22px/1.35 Unbounded,sans-serif;background:var(--hl);color:#121a33;padding:22px;border-radius:18px}
.st{padding:5px 10px;border-radius:8px;margin:3px 0}.st.on{background:var(--hl);color:#121a33;font-weight:700}.st.past{color:var(--mu);text-decoration:line-through}
.in{width:64px}details summary{cursor:pointer;font-weight:700}details pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:10px;color:var(--mu);padding:4px 0}nav button b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--ac);font-weight:700}

/* Алгоритм: ставимо найважчі задачі в години, де рівень енергії відповідає ресурсу; потім компроміс */
function route(){const E=S.en,pl=[],un=[];let s=S.start.split(':').map(Number);s=Math.ceil((s[0]*60+s[1])/15)*15;
const lv=(t,m)=>{const a=[];for(let x=t;x<t+m;x+=15)a.push(E[Math.floor(x/60)%24]);return a};
const ok=(k,t,p)=>{const a=lv(t,k.m);if(k.e==1)return p==0?a.every(v=>v==1):p==1?a.every(v=>v>0&&v<3):a.every(v=>v>0);return p==0?a.every(v=>v>=k.e):p==1?a.every(v=>v>0&&v>=k.e-1):a.every(v=>v>0)};
S.tasks.filter(k=>!k.done).sort((a,b)=>b.e-a.e||b.p-a.p).forEach(k=>{for(let p=0;p<3;p++)for(let t=s;t+k.m<=1380;t+=15){if(pl.some(b=>t<b.t+b.k.m+5&&t+k.m+5>b.t))continue;if(ok(k,t,p)){pl.push({t,k,p});return}}un.push(k)});
return{pl:pl.sort((a,b)=>a.t-b.t),un}}

${un.length?`<div class="c mu">Не влізло до 23:00: ${un.map(k=>esc(k.t)).join(', ')}. Скороти завдання або зсунь старт.</div>`:''}

V.proj=function(){return`<div class="c"><div class="r"><input class="g" id="pn" placeholder="Нова мета або проєкт"><button class="p" data-a="pnew">Створити</button></div><div class="r" style="margin-top:8px"><input class="g" id="pin" placeholder="Текст підпункту"></div><div class="mu" style="margin-top:4px">Введи текст і торкнись «+» біля пункту, куди його вкласти. «→» переносить пункт у маршрут дня.</div></div>`+S.proj.map((n,i)=>{const c=cn(n);return`<div class="c"><div class="bar" style="margin-bottom:6px"><i style="width:${c[0]/c[1]*100}%"></i></div>${tree(n,''+i)}</div>`}).join('')};

const BC='Мотивація',BT="======================================================================\n         ДЕВІД ҐОҐҐІНС: НІЧОГО МЕНЕ НЕ ЗЛАМАЄ (CAN'T HURT ME)\n             Стисла вижимка, головні концепції та інструменти\n======================================================================\n\n1. ГОЛОВНА ІДЕЯ КНИГИ\n----------------------------------------------------------------------\nБільшість людей використовують лише близько 40% свого потенціалу. \nНаш мозок має внутрішній «запобіжник» (governor), який вмикається при \nперших ознаках болю, втоми чи дискомфорту, намагаючись захистити нас. \n\nСправжній розвиток починається тоді, коли ви свідомо переступаєте через \nцей бар'єр, виходьте із зони комфорту та будуєте «броньований розум».\n\n----------------------------------------------------------------------\n2. 7 КЛЮЧОВИХ ІНСТРУМЕНТІВ ДЕВІДА ҐОҐҐІНСА\n----------------------------------------------------------------------\n\n1. ДЗЕРКАЛО ВІДПОВІДАЛЬНОСТІ (Accountability Mirror)\n   • Суть: Жорстка і чесна самооцінка без прикрас та виправдань.\n   • Практика: Наклеюйте на дзеркало стікери зі своїми слабкостями, \n     страхами, недоліками та конкретними цілями. Щоранку дивіться собі \n     в очі та вимагайте від себе звіту за кожну дію.\n\n2. ПРАВИЛО 40% (The 40% Rule)\n   • Суть: Коли ви відчуваєте виснаження і ваш розум каже, що ви більше \n     не спроможні зробити жодного кроку — ви використали лише 40% ресурсів.\n   • Практика: У моменти найбільшої втоми усвідомте, що це лише захист \n     мозку. Пробивайте цей бар'єр і робіть ще 5-10% понад заплановане.\n\n3. БАНКА З ПЕЧИВОМ (The Cookie Jar)\n   • Суть: Ментальний резервуар вашої внутрішньої сили.\n   • Практика: Запишіть усі свої минулі перемоги, подолані труднощі, \n     біль та виклики, які ви змогли пережити. У важкі хвилини «діставайте \n     печиво» з пам'яті — згадуйте, хто ви є і через що вже пройшли.\n\n4. ЗАХОПЛЕННЯ ДУШ (Taking Souls)\n   • Суть: Ментальне домінування над труднощами, суперниками чи болем.\n   • Практика: Коли обставини, суперники або критики очікують вашого \n     зламу, працюйте із потрійною силою. Покажіть їм, що їхній тиск \n     робить вас тільки сильнішими.\n\n5. ЗАГАРТУВАННЯ РОЗУМУ (Callousing the Mind)\n   • Суть: Розум загартовується так само, як шкіра на руках — через \n     тертя та постійне навантаження.\n   • Практика: Щодня робіть те, що викликає у вас дискомфорт або \n     лінь (ранковий біг, холодна вода, важке навчання, прибирання). \n     Привчайте розум до дисципліни.\n\n6. ЗАПИТАННЯ «ЩО, ЯКЩО?» (What If?)\n   • Суть: Інструмент для подолання зневіри оточуючих та власних сумнівів.\n   • Практика: Коли люди або ваш власний страх кажуть, що це неможливо, \n     запитайте себе: «А що, якщо я зможу це зробити?». Це перетворює \n     сумніви на паливо.\n\n7. АНАЛІЗ ПОРАЗОК / ПІСЛЯОПЕРАЦІЙНИЙ ОГЛЯД (After Action Report)\n   • Суть: Поразка — це не фінал, а джерело цінних даних для зростання.\n   • Практика: Після невдачі приберіть емоції та саможаль. Проаналізуйте: \n     що пішло не так, як ви відреагували, які помилки допущено та що \n     зробите інакше наступного разу.\n\n----------------------------------------------------------------------\n3. ОСНОВНІ ЖИТТЄВІ УРОКИ\n----------------------------------------------------------------------\n• Ніхто не прийде тебе рятувати: Твоє минуле чи важке дитинство — це \n  не виправдання для слабкості, а стартовий майданчик та паливо.\n• Мотивація — це дурниця, дисципліна — це все: Мотивація швидко минає, \n  коли стає боляче чи холодно. Працює тільки залізна дисципліна.\n• Прийми свої \"погані карти\": Не порівнюй себе з іншими. Грай тими \n  картами, які тобі випали, і витискай з них максимум.\n• Не зупиняйся, коли втомився. Зупиняйся, коли справу зроблено.\n\n======================================================================";

1. ГОЛОВНА ІДЕЯ КНИГИ
----------------------------------------------------------------------
Фінішної лінії не існує. Якщо перша книга («Нічого мене не зламає») 
навчала вибиратися з дна та будувати фундаментальну дисципліну, то 
«Ніколи не спиняйся» розкриває, як діяти, коли ви вже досягли успіху 
та визнання.

Комфорт і досягнутий успіх можуть зробити людину м'якою так само легко, 
як і поразка. Справжня велич — це не разовий фініш, а постійний процес 
самовдосконалення, який триває все життя.

----------------------------------------------------------------------
2. КЛЮЧОВІ ІНСТРУМЕНТИ ТА КОНЦЕПЦІЇ
----------------------------------------------------------------------

1. МЕНТАЛІТЕТ «НІКОЛИ НЕ ЗАВЕРШЕНО» (Never Finished Mindset)
   • Суть: Будь-яка перемога — це лише новий стартовий майданчик.
   • Практика: Не дозволяйте минулим здобуткам заколисувати ваші амбіції. 
     Як тільки ви досягаєте мети, ставте нову планку, щоб не потрапити 
     в пастку самовдоволення.

2. СЕКУНДНЕ РІШЕННЯ (The One-Second Decision)
   • Суть: У момент найгострішого болю, виснаження чи бажання все 
     кинути, ваша доля вирішується за одну секунду.
   • Практика: Коли мозок починає панікувати й благає зупинитися, 
     зробіть паузу на 1 секунду. Перехопіть контроль у емоцій та 
     прийміть свідоме рішення: «Я роблю наступний крок».

3. МЕНТАЛЬНА ЛАБОРАТОРІЯ (The Mental Lab)
   • Суть: Глибока та холодна аналітика власних помилок, слабкостей 
     і внутрішніх травм.
   • Практика: Розкладайте свої невдачі як науковий експеримент — без 
     сорому та емоцій. Ставте собі запитання: «Де саме я змалодушно 
     відступив? Які дані з цієї поразки зроблять мене сильнішим?».

4. ДИСЦИПЛІНА БЕЗ АПЛОДИСМЕНТІВ (Diligence Without Applause)
   • Суть: Справжній характер гартується тоді, коли ніхто не бачить.
   • Практика: Працюйте над собою не заради похвали, оцінок чи лайків 
     у соціальних мережах, а виключно через повагу до власних 
     внутрішніх стандартів.

5. ГОТОВНІСТЬ ЗНОВУ СТАТИ НОВАЧКОМ (Wreckage & Rebuilding)
   • Суть: Здатність добровільно руйнувати свою зону комфорту.
   • Практика: Не бійтеся виходити у нові сфери, де ви нічого не 
     вмієте, знову відчути себе найслабшим і пройти шлях від 
     початківця до майстра.

6. ЛІДЕРСТВО ЧЕРЕЗ ВЛАСНУ СТІЙКІСТЬ (Leading by Example)
   • Суть: Слова та теорія не надихають так, як реальні дії.
   • Практика: Показуйте приклад власною працею, витривалістю та 
     дисципліною. Ваші вчинки мають говорити гучніше за будь-які розмови.

----------------------------------------------------------------------
3. ОСНОВНІ ЖИТТЄВІ УРОКИ
----------------------------------------------------------------------
• Успіх — це пастка: Зона комфорту після перемоги затягує не менш 
  небезпечно, ніж зневіра після поразки.
• Орендна плата за велич сплачується щодня: Вчорашній успіх не 
  зараховується сьогодні. Дисципліну потрібно підтверджувати щоранку.
• Твій єдиний суперник — це ти вчорашній: Порівнюй себе лише із тим, 
  ким ти був учора, та із тим, ким ти потенційно можеш стати.

const BTE2=`======================================================================
       DAVID GOGGINS: NEVER FINISHED
   Free your mind and win the war within (Short summary)
======================================================================

1. THE MAIN IDEA OF THE BOOK
----------------------------------------------------------------------
There is no finish line. If the first book ("Can't Hurt Me") taught how
to climb out of the pit and build fundamental discipline, "Never
Finished" shows how to act once you have already achieved success and
recognition.

Comfort and success can make a person soft just as easily as defeat.
True greatness is not a one-time finish but a continuous process of
self-improvement that lasts a lifetime.

----------------------------------------------------------------------
2. KEY TOOLS AND CONCEPTS
----------------------------------------------------------------------

1. THE "NEVER FINISHED" MINDSET
   • Essence: every victory is just a new starting platform.
   • Practice: don't let past achievements lull your ambition. As soon
     as you reach a goal, set a new bar so you don't fall into the trap
     of complacency.

2. THE ONE-SECOND DECISION
   • Essence: at the moment of sharpest pain, exhaustion or the urge to
     quit, your fate is decided in a single second.
   • Practice: when your brain starts to panic and begs you to stop,
     pause for 1 second. Take control back from your emotions and make
     a conscious decision: "I'm taking the next step."

3. THE MENTAL LAB
   • Essence: deep, cold analysis of your own mistakes, weaknesses and
     inner wounds.
   • Practice: break your failures down like a scientific experiment -
     without shame or emotion. Ask yourself: "Where exactly did I back
     down? What data from this defeat will make me stronger?"

4. DILIGENCE WITHOUT APPLAUSE
   • Essence: real character is forged when no one is watching.
   • Practice: work on yourself not for praise, grades or social media
     likes, but solely out of respect for your own inner standards.

5. WILLINGNESS TO BE A BEGINNER AGAIN (Wreckage & Rebuilding)
   • Essence: the ability to willingly tear down your own comfort zone.
   • Practice: don't be afraid to step into new fields where you know
     nothing, feel like the weakest again, and walk the path from
     beginner to master.

6. LEADING BY EXAMPLE
   • Essence: words and theory don't inspire like real actions do.
   • Practice: set an example with your own work, endurance and
     discipline. Your actions should speak louder than any talk.

----------------------------------------------------------------------
3. MAIN LIFE LESSONS
----------------------------------------------------------------------
• Success is a trap: the comfort zone after a victory pulls you in just
  as dangerously as despair after a defeat.
• The rent for greatness is paid daily: yesterday's success doesn't
  count today. Discipline must be proven again every morning.
• Your only rival is yesterday's you: compare yourself only with who
  you were yesterday and who you could potentially become.

const BTE=`======================================================================
         DAVID GOGGINS: CAN'T HURT ME
          Short summary, key concepts and tools
======================================================================

1. THE MAIN IDEA OF THE BOOK
----------------------------------------------------------------------
Most people use only about 40% of their potential.
Our brain has an inner "governor" that switches on at the first signs
of pain, fatigue or discomfort, trying to protect us.

Real growth begins when you deliberately step over this barrier, leave
your comfort zone and build an "armored mind".

----------------------------------------------------------------------
2. DAVID GOGGINS' 7 KEY TOOLS
----------------------------------------------------------------------

1. THE ACCOUNTABILITY MIRROR
   • Essence: harsh, honest self-assessment with no sugarcoating or excuses.
   • Practice: stick notes on your mirror with your weaknesses, fears,
     flaws and concrete goals. Every morning look yourself in the eye and
     demand an account of every action.

2. THE 40% RULE
   • Essence: when you feel exhausted and your mind says you can't take
     another step, you have used only 40% of your resources.
   • Practice: at moments of greatest fatigue, realize it is only your
     brain's protection. Break through the barrier and do another 5–10%
     beyond what you planned.

3. THE COOKIE JAR
   • Essence: a mental reservoir of your inner strength.
   • Practice: write down all your past victories, hardships overcome,
     pain and challenges you survived. In hard moments, "take a cookie"
     from memory — remember who you are and what you have already been through.

4. TAKING SOULS
   • Essence: mental domination over hardship, rivals or pain.
   • Practice: when circumstances, rivals or critics expect you to break,
     work with triple force. Show them their pressure only makes you stronger.

5. CALLOUSING THE MIND
   • Essence: the mind toughens like the skin of your hands — through
     friction and constant load.
   • Practice: every day do something that causes discomfort or laziness
     (morning run, cold water, hard study, cleaning). Train your mind
     to discipline.

6. THE "WHAT IF?" QUESTION
   • Essence: a tool for overcoming the doubt of others and your own.
   • Practice: when people or your own fear say it's impossible, ask
     yourself: "What if I can do it?" This turns doubt into fuel.

7. AFTER ACTION REPORT
   • Essence: defeat is not the end but a source of valuable data for growth.
   • Practice: after a failure, remove emotion and self-pity. Analyze:
     what went wrong, how you reacted, what mistakes were made and what
     you will do differently next time.

----------------------------------------------------------------------
3. MAIN LIFE LESSONS
----------------------------------------------------------------------
• Nobody is coming to save you: your past or hard childhood is not an
  excuse for weakness, but a launch pad and fuel.
• Motivation is nonsense, discipline is everything: motivation fades fast
  when it gets painful or cold. Only iron discipline works.
• Accept your "bad cards": don't compare yourself with others. Play the
  cards you were dealt and squeeze the maximum out of them.
• Don't stop when you're tired. Stop when the job is done.
