`<div class="c r"><input class="g" id="nx" placeholder="Нова вправа в цей день"><button data-a="addex">Додати</button></div>

function route(){const E=S.en,pl=[],un=[];let s=S.start.split(':').map(Number);s=Math.ceil((s[0]*60+s[1])/15)*15;
const lv=(t,m)=>{const a=[];for(let x=t;x<t+m;x+=15)a.push(E[Math.floor(x/60)%24]);return a};
const ok=(k,t,p)=>{const a=lv(t,k.m);if(k.e==1)return p==0?a.every(v=>v==1):p==1?a.every(v=>v>0&&v<3):a.every(v=>v>0);return p==0?a.every(v=>v>=k.e):p==1?a.every(v=>v>0&&v>=k.e-1):a.every(v=>v>0)};
S.tasks.filter(k=>!k.done).sort((a,b)=>b.e-a.e||b.p-a.p).forEach(k=>{for(let p=0;p<3;p++)for(let t=s;t+k.m<=1380;t+=15){if(pl.some(b=>t<b.t+b.k.m+5&&t+k.m+5>b.t))continue;if(ok(k,t,p)){pl.push({t,k,p});return}}un.push(k)});
return{pl:pl.sort((a,b)=>a.t-b.t),un}}

smv:e=>{const k=S.skills[e.dataset.k],j=+e.dataset.j,t=j+ +e.dataset.d;if(t<0||t>=k.st.length)return;[k.st[j],k.st[t]]=[k.st[t],k.st[j]];if(k.i==j)k.i=t;else if(k.i==t)k.i=j;save();R()},
sdl:e=>{const k=S.skills[e.dataset.k],j=+e.dataset.j;k.st.splice(j,1);if(k.i>=j&&k.i>0)k.i--;save();R()},
sad:e=>{const v=g('sa'+e.dataset.k).trim();if(v){S.skills[e.dataset.k].st.push(v);save();R()}},
scl:e=>{S.skills[e.dataset.k].log=[];save();R()},
sdk:e=>{S.skills.splice(e.dataset.k,1);Object.keys(SE).forEach(x=>delete SE[x]);save();R()},
sknew:()=>{const n=g('skn').trim();if(n){S.skills.push({n,u:'с',i:0,st:[],log:[]});SE[S.skills.length-1]=1;save();R()}}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const k=S.skills[t.dataset.k];if(f=='sn')k.n=t.value.trim()||k.n;if(f=='su')k.u=t.value.trim()||'с';if(f=='ss')k.st[t.dataset.j]=t.value.trim()||k.st[t.dataset.j];save()});
save();

/* ===== Час Києва та погода (Open-Meteo) ===== */
const TZ=(()=>{try{new Intl.DateTimeFormat('uk',{timeZone:'Europe/Kyiv'});return'Europe/Kyiv'}catch(e){return'Europe/Kiev'}})();
const kclock=()=>{const e=$('#ck');if(e)e.textContent='Київ · '+new Date().toLocaleTimeString('uk-UA',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'})};
const WC=c=>c==0?['☀️','Ясно']:c==1?['🌤','Переважно ясно']:c==2?['⛅','Мінлива хмарність']:c==3?['☁️','Хмарно']:c<=48?['🌫','Туман']:c<=57?['🌦','Мряка']:c<=67?['🌧','Дощ']:c<=77?['🌨','Сніг']:c<=82?['🌧','Злива']:c<=86?['🌨','Снігопад']:['⛈','Гроза'];
const WDIR=['пн','пн-сх','сх','пд-сх','пд','пд-зх','зх','пн-зх'];
const WURL='https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.52&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&wind_speed_unit=ms&timezone=auto&forecast_days=7';
let W=S.wx||null,WS='';
async function wxLoad(){if(WS=='load')return;WS='load';if(tab=='wx')R();
try{const r=await fetch(WURL);if(!r.ok)throw 0;const j=await r.json();W={t:Date.now(),c:j.current,d:j.daily};S.wx=W;save();WS=''}catch(e){WS='err'}
if(tab=='wx')R()}
V.wx=function(){const c=W&&W.c,d=W&&W.d;
if(!c)return`<div class="c"><div class="mu">${WS=='err'?'Не вдалося завантажити погоду. Перевір інтернет.':'Завантажую погоду…'}</div><button class="p" data-a="wxr" style="margin-top:8px">Спробувати ще</button></div>`;
const w=WC(c.weather_code),u=new Date(W.t).toLocaleTimeString('uk-UA',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}),r=x=>Math.round(x);
return`<div class="big" style="cursor:default"><div style="font-size:56px;line-height:1">${w[0]}</div><b style="margin-top:8px">${r(c.temperature_2m)}°</b><div>${w[1]} · відчувається як ${r(c.apparent_temperature)}°</div></div>
<div class="wg"><div class="c"><div class="mu">💧 Вологість</div><b>${r(c.relative_humidity_2m)}%</b></div><div class="c"><div class="mu">💨 Вітер</div><b>${r(c.wind_speed_10m)} м/с</b> <span class="mu">${WDIR[r(c.wind_direction_10m/45)%8]}</span></div><div class="c"><div class="mu">🌧 Опади зараз</div><b>${c.precipitation} мм</b></div><div class="c"><div class="mu">🌡 Сьогодні</div><b>${r(d.temperature_2m_min[0])}…${r(d.temperature_2m_max[0])}°</b></div></div>
<h2>Прогноз на тиждень</h2><div class="c">${d.time.map((t,i)=>`<div class="wd"><span style="width:52px;text-transform:capitalize">${i?new Date(t+'T12:00:00').toLocaleDateString('uk-UA',{weekday:'short'}):'Сьогодні'}</span><span>${WC(d.weather_code[i])[0]}</span><span class="mu g">${d.precipitation_sum[i]>0?d.precipitation_sum[i]+' мм':''}</span><b>${r(d.temperature_2m_max[i])}°</b><span class="mu" style="width:36px;text-align:right">${r(d.temperature_2m_min[i])}°</span></div>`).join('')}</div>
<div class="r"><span class="mu g">Київ · оновлено о ${u}${WS=='load'?' · оновлюю…':WS=='err'?' · немає зв’язку, показано збережене':''}</span><button data-a="wxr" aria-label="Оновити погоду">↻</button></div><p class="mu">Дані: Open-Meteo.com</p>`};
A.wxr=()=>wxLoad();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

R();kclock();setInterval(kclock,1000);wxLoad();setInterval(wxLoad,6e5);
</script></body></html>
